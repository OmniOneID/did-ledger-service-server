spring:
  application:
    name: Ledger-Service-Server
  profiles:
    default: dev
    group:
      dev:
        - auth
        - database
        - jasypt
        - logging
        - spring-docs
        - tas
      sample:
        - auth
        - database
        - jasypt
        - logging
        - spring-docs
        - tas
      prod:
        - auth
        - database
        - jasypt
        - logging
        - spring-docs
        - tas
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

server:
  port: 8098

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include:
          - "health"
          - "shutdown"
  endpoint:
    health:
      enabled: true
      show-details: "never"
    shutdown:
      enabled: false

jasypt:
  encryptor:
    algorithm: PBEWithHMACSHA512AndAES_256